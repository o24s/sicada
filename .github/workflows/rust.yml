name: CI

on:
  push:
    branches: ["main"]
    paths:
      - "sicada/**"
      - "sicada-decode/**"
      - ".github/workflows/**"
      - "Cargo.toml"
      - "Cargo.lock"
  pull_request:
    branches: ["main"]
    paths:
      - "sicada/**"
      - "sicada-decode/**"
      - ".github/workflows/**"
      - "Cargo.toml"
      - "Cargo.lock"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build_and_test:
    name: Build and Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2.9.1
        with:
          cache-on-failure: true
          cache-bin: false

      - name: Build
        run: cargo build --verbose --workspace --exclude sicada-bench --all-features

      - name: Run tests on ${{ matrix.os }}
        run: cargo test --verbose --workspace --exclude sicada-bench --all-features
